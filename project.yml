name: Yabbistir
options:
  bundleIdPrefix: dev.yabbistir
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  YabbistirKit:
    path: Packages/YabbistirKit
targets:
  Yabbistir:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "ExtensionHost/**"
      - path: Extensions/BuiltinExtensions
        type: folder
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, es, fr, tr, ja, ko, zh-Hans, zh-Hant]
        CFBundleShortVersionString: "0.5.1"
        CFBundleVersion: "7"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        # Store extensions such as Browser Tabs and Send To run osascript to read another app's tabs or add a note to it.
        # macOS attributes those Apple events to yabbistir and shows this text when it asks, once per app.
        NSAppleEventsUsageDescription: "Some extensions you install talk to other apps, for example to read Safari's open tabs or to add a note to Notes. macOS asks once for each app."
        # yabbistir://store opens Settings › Extensions › Store; yabbistir://store/install?id=… (the website's Install
        # buttons) also picks those extensions and shows the consent sheet. A link never installs anything by itself.
        CFBundleURLTypes:
          - CFBundleURLName: dev.yabbistir.app
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [yabbistir]
    entitlements:
      path: App/Yabbistir.entitlements
      properties:
        # Hardened runtime blocks Apple events without it, so macOS would refuse an extension's osascript without asking.
        com.apple.security.automation.apple-events: true
    dependencies:
      - package: YabbistirKit
        product: YabCore
      - package: YabbistirKit
        product: YabPasteboard
      - package: YabbistirKit
        product: YabPlatform
      - package: YabbistirKit
        product: YabLocalization
      - package: YabbistirKit
        product: YabUI
      - package: YabbistirKit
        product: YabImport
      - package: YabbistirKit
        product: YabStack
      - package: YabbistirKit
        product: YabExtensionKit
      - package: YabbistirKit
        product: YabExtensions
      - target: ExtensionHost
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: yabbistir
        PRODUCT_BUNDLE_IDENTIFIER: dev.yabbistir.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
      configs:
        # The Debug build has its own identity, so macOS keeps separate privacy entries for it and an installed release.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.yabbistir.app.debug
          APP_DISPLAY_NAME: yabbistir Dev
        Release:
          APP_DISPLAY_NAME: yabbistir
          # Xcode otherwise injects get-task-allow (and for the helper an application-identifier), which notarization rejects.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  ExtensionHost:
    type: tool
    platform: macOS
    sources:
      - path: App/ExtensionHost
    entitlements:
      path: App/ExtensionHost/ExtensionHost.entitlements
      properties:
        # Measured: the helper's JavaScriptCore is ~15x faster with the JIT. Never on the app.
        com.apple.security.cs.allow-jit: true
        # The helper starts an extension's tools (yab.exec), osascript among them; see the app's entitlement.
        com.apple.security.automation.apple-events: true
    dependencies:
      - package: YabbistirKit
        product: YabExtensionRuntime
    settings:
      base:
        PRODUCT_NAME: yabbistir-extension-host
        PRODUCT_BUNDLE_IDENTIFIER: dev.yabbistir.extension-host
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SKIP_INSTALL: YES
      configs:
        Release:
          # Xcode otherwise injects get-task-allow (and for the helper an application-identifier), which notarization rejects.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
